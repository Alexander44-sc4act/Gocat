name: Feature Request
description: Suggest a new feature for GoCat
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? What is the use case?
      placeholder: |
        I often need to ..., but GoCat currently ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What should it look like? Concrete examples help.
      placeholder: |
        ```bash
        gocat listen --flag 8080
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Workarounds or other tools that solve this today (optional).

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests
          required: true
        - label: This fits GoCat's scope as a netcat alternative
          required: true
