# GoCat Docker Compose - working services only (gocat, dev, test)

services:
  gocat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        VERSION: ${VERSION:-dev}
        BUILD_TIME: ${BUILD_TIME}
        GIT_COMMIT: ${GIT_COMMIT}
    image: gocat:latest
    container_name: gocat-main
    restart: unless-stopped
    networks:
      - gocat-network
    ports:
      - "8080:8080"
      - "9999:9999"
    environment:
      - GOCAT_LOG_LEVEL=${LOG_LEVEL:-info}
    command: ["listen", "8080"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/gocat", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  gocat-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: gocat:dev
    container_name: gocat-dev
    restart: "no"
    networks:
      - gocat-network
    ports:
      - "8081:8080"
      - "9998:9999"
    environment:
      - GOCAT_LOG_LEVEL=debug
      - GO_ENV=development
    volumes:
      - .:/app:rw
      - go-mod-cache:/go/pkg/mod
    working_dir: /app
    command: ["/app/gocat-debug", "--help"]
    profiles:
      - dev

  gocat-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: testing
    image: gocat:test
    container_name: gocat-test
    networks:
      - gocat-network
    environment:
      - GO_ENV=test
      - GOCAT_LOG_LEVEL=debug
    volumes:
      - .:/app:ro
      - test-results:/app/test-results:rw
    command: ["go", "test", "-v", "-coverprofile=test-results/coverage.out", "./..."]
    profiles:
      - test

networks:
  gocat-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  go-mod-cache:
    driver: local
  test-results:
    driver: local

# Usage:
#   docker compose up gocat                  # listener on :8080
#   docker compose --profile dev up gocat-dev
#   docker compose --profile test up gocat-test
